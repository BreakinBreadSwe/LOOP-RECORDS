<title>Loop Records Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Loop Records, Stockholm 1993 to 1998. Every release, every credit, every video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a record-shop index. Sticky search bar, crate grid of sleeves, detail views read like a label's run-out sheet. */
:root{
  --bg:#eceef1; --surface:#f8f9fb; --ink:#12141a; --muted:#545b6a; --line:#cfd4dc;
  --loop:#ff4400; --loop-ink:#12141a; --loop-text:#b83000; --blue:#1f16b2; --tint:#ffe1d4; --scrim:rgba(18,20,26,.72); --scrim-ink:#ffffff; --ok:#17713a; --warn:#8a5a00; --bad:#b3261e; --plump:#8a2f74; --related:#4d6b2f; --focus:#1f16b2;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f15; --surface:#161a23; --ink:#e9ebf1; --muted:#9aa2b3; --line:#2a303d;
  --loop:#ff5a1f; --loop-ink:#0d0f15; --loop-text:#ff8552; --blue:#8f88ff; --tint:#3b2016; --scrim:rgba(0,0,0,.7); --scrim-ink:#ffffff; --ok:#6fd38f; --warn:#f0b851; --bad:#ff8f86; --plump:#e08ccc; --related:#a7c97f; --focus:#8f88ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f15; --surface:#161a23; --ink:#e9ebf1; --muted:#9aa2b3; --line:#2a303d;
  --loop:#ff5a1f; --loop-ink:#0d0f15; --loop-text:#ff8552; --blue:#8f88ff; --tint:#3b2016; --scrim:rgba(0,0,0,.7); --scrim-ink:#ffffff; --ok:#6fd38f; --warn:#f0b851; --bad:#ff8f86; --plump:#e08ccc; --related:#a7c97f; --focus:#8f88ff; color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:none;margin:0 auto}
a{color:var(--ink);font-weight:600;text-decoration:none;border-radius:4px;transition:color .15s,background-color .15s}
a:hover{color:var(--loop-text)}
.plink{display:inline-block;padding:1px 10px;margin:1px 0;border-radius:999px;background:var(--tint);color:var(--ink);font-weight:600;line-height:1.6}
.plink:hover{background:var(--loop);color:var(--loop-ink)}
.btn.primary:hover{color:var(--loop-ink)}
nav.views a[aria-current="page"]:hover,.subnav a[aria-current="page"]:hover{color:var(--bg)}
.artline .plink{font-size:20px;padding:2px 14px}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;font:600 14px/1 var(--body);padding:9px 14px 9px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.back::before{content:"";width:7px;height:7px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:3px}
.back:hover{border-color:var(--loop);color:var(--loop-text)}
.people li a{font-weight:500}
.credits a:not(.plink){font-weight:600}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;z-index:20;background:var(--surface);padding:8px 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);flex:none}
.brand .words{display:flex;flex-direction:column;gap:4px;width:min-content}
/* The real Loop logo, vectorized from the sleeves: spiral (LOOP 012 label) and lettering (LOOP 001 sleeve). */
.brand .mark{display:block;flex:none;background:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.brand .mk-spiral{width:38px;height:40px;color:var(--logo-spiral,var(--loop));transition:color .8s;-webkit-mask-image:url("__LOGO_SPIRAL__");mask-image:url("__LOGO_SPIRAL__")}
.brand .mk-word{width:203px;height:18px;color:var(--logo-word,var(--ink));transition:color .8s;-webkit-mask-image:url("__LOGO_WORD__");mask-image:url("__LOGO_WORD__")}
@media (max-width:640px){.brand{order:1;flex:0 0 100%;gap:10px;max-width:none}.brand .mk-spiral{width:auto;height:auto;flex:0 0 min(15%,64px);aspect-ratio:38/40}.brand .words{flex:0 1 350px;width:auto;gap:5px}.brand .mk-word{width:100%;height:auto;aspect-ratio:203/18}}
@media (forced-colors:active){.brand .mark{background:CanvasText}}
.brand .era{display:block;width:100%;height:auto;aspect-ratio:20/1;color:var(--muted);overflow:visible}
.brand .era text{font:500 10px var(--mono);fill:currentColor;text-transform:uppercase}
.theme{display:flex;align-items:center;gap:6px;font:600 13px var(--body)}
.tools{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;margin-left:auto}
nav.views{display:flex;flex-wrap:nowrap;gap:2px}
.ico{display:inline-grid;place-items:center;width:38px;height:38px;padding:0;border:0;border-radius:999px;background:none;color:var(--ink);cursor:pointer;text-decoration:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico:hover{background:var(--surface)}
.ico[aria-current="page"]{background:var(--ink);color:var(--bg)}
.ico[hidden]{display:none}
@media (max-width:520px){.ico{width:30px;height:30px}.ico svg{width:20px;height:20px}.tools,nav.views{gap:0}.bar{gap:10px 6px}}
.search{order:3;flex:1 1 100%}
@media (min-width:900px){.search{order:2;flex:1 1 220px}.tools{order:3;margin-left:0}}
/* Phones: the search box is small until you tap it; then it takes the whole row (the icons step aside)
   and a search button appears at its end. When you leave it, it goes back to small. */
/* Phones: the search box keeps its small place in the row; when opened, the box glides out over the icons
   (one smooth S-curve) while they fade, so nothing else on the row moves. */
@media (max-width:640px){.search{order:2;flex:1 0 7.5em;height:44px;z-index:2}.search input{padding:8px 12px}
  .search .sbox{position:absolute;left:0;top:0;bottom:0;width:100%;display:flex;align-items:center;transition:width .5s cubic-bezier(.65,0,.35,1)}
  .search.open .sbox{width:calc(100vw - max(16px,env(safe-area-inset-left,0px)) - max(16px,env(safe-area-inset-right,0px)))}
  .tools nav.views{display:contents}
  .bar{column-gap:0}
  .tools::before{content:"";flex:none;width:0}
  .tools{order:3;margin-left:0;flex:100 1 0;max-width:330px;justify-content:space-between;transition:opacity .35s cubic-bezier(.65,0,.35,1) .1s,visibility 0s}
  .bar:has(.search.open) .tools{opacity:0;visibility:hidden;transition:opacity .25s cubic-bezier(.65,0,.35,1),visibility 0s .3s}}
.sbox{display:flex;flex:1;min-width:0;position:relative;align-items:center}
@media (prefers-reduced-motion:reduce){.search .sbox,.tools{transition:none!important}}
.pastebox{margin-top:12px;padding:12px;border:2px dashed var(--loop);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.pastebox label{font-weight:600}
.pastebox textarea{font:15px var(--body);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:none;width:100%}
.search{display:flex;min-width:0;position:relative;align-items:center}
.searchgo{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;padding:0;place-items:center}
.searchgo svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.search.open .searchgo{display:grid}
.search.open input{padding-right:46px}
.search input{flex:1;min-width:0;font:16px var(--body);padding:10px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--ink)}
.chip{font:600 14px/1 var(--body);padding:9px 14px;white-space:nowrap;border-radius:999px;border:1.5px solid var(--muted);color:var(--ink);text-decoration:none;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (max-width:520px){main .chip{font-size:13px;padding:8px 10px}main .chiprow{gap:4px}main .chip.icochip{padding:0;width:32px;height:32px}.countrow .count{font-size:12px}}

main{padding-block:24px 64px}
/* The release list starts close under the header: the filters are the first thing there. */
main > h1.sr + .filters.top{margin-top:-12px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1;letter-spacing:.01em}
h1{font-size:clamp(32px,5.5vw,58px);font-weight:900;text-transform:uppercase;margin:0 0 8px}
/* The page title gets focus on navigation so screen readers start there; no visible outline for that. */
[tabindex="-1"]:focus{outline:none}
h2{font-size:30px;font-weight:800;text-transform:uppercase;margin:36px 0 12px}
h3{font-size:20px;font-weight:800;margin:0}
.lede{max-width:65ch;color:var(--muted);margin:0 0 20px}
.count{font:500 13px var(--mono);color:var(--muted);margin:0 0 14px}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 18px;list-style:none;padding:0;margin:0}
.grid a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.sleeve{aspect-ratio:1;width:100%;max-width:100%;border-radius:3px;overflow:hidden;background:var(--surface);box-shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(0,0,0,.5);transition:transform .15s}
.sleeve img,.sleeve svg{display:block;width:100%;height:100%;object-fit:contain;background:var(--surface)}
a.card:hover .sleeve:not(.multi){transform:translateY(-3px) rotate(-.6deg)}
.cat{font:500 12px var(--mono);letter-spacing:.04em;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--loop);flex:none}
.dot.plump{background:var(--plump)}.dot.related{background:var(--related)}
.card .t{font-weight:600;line-height:1.25}
.card .a{color:var(--muted);font-size:14px;line-height:1.3}
.pickgrid button.card{display:flex;flex-direction:column;gap:8px;width:100%;padding:0;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:6px}
.pickgrid button.card:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.pickgrid .pill{align-self:flex-start}

.people{list-style:none;padding:0;margin:0;columns:3 260px;column-gap:28px}
.people li{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.people .meta{font:12px var(--mono);color:var(--muted);text-align:right;min-width:0;overflow-wrap:anywhere}
.people li a{flex:0 1 auto;min-width:0}
h2.sect{font-size:22px;margin:26px 0 10px}
main > .pagetitle + .roles,main > .pagetitle + .note{margin-top:0}
.people li .meta{flex:0 1 55%}

/* Release page: from tablet width the artwork column (with All releases) stays in place while the
   tracklist, credits and videos scroll beside it. */
.detail{display:grid;grid-template-columns:minmax(0,clamp(340px,38vw,560px)) minmax(0,1fr);gap:32px;align-items:start}
.detail .relside{position:sticky;top:calc(var(--hdrh,80px) + 12px);max-height:calc(100vh - var(--hdrh,80px) - var(--dockh,0px) - 24px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:2px;transition:top .25s}
body:has(header.top.away) .detail .relside{top:8px;max-height:calc(100vh - var(--dockh,0px) - 16px)}
/* Release page = two panes that each scroll on their own; the page itself never moves, so nothing
   slides away when you reach the end or pull too hard (iPad bounce). */
body.relpage{overflow:hidden;overscroll-behavior:none}
body.relpage > footer{display:none}
body.relpage main{padding-bottom:0}
body.relpage .detail{height:calc(100dvh - var(--hdrh,80px) - var(--dockh,0px) - 54px);align-items:stretch}
body.relpage .detail > div{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body.relpage .detail .relside{position:static;max-height:none}
body.relpage .detail > div:last-child{padding-right:4px;padding-bottom:24px}
/* Phones too: two columns, the artwork and All releases stay put, the text scrolls beside them. */
@media (max-width:760px){.detail{grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:14px}
  .detail > div:last-child{min-width:0;overflow-wrap:anywhere}
  .detail h1{font-size:clamp(24px,7vw,34px)}
  .detail .relside .back{margin-bottom:10px;padding:7px 10px 7px 8px;font-size:13px}
  .detail .relside .btnrow{gap:6px}
  .detail .relside .slidectl{flex-wrap:wrap;gap:6px;justify-content:center}
  .detail .relside .slcount{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .detail .relside .navbtn{width:32px;height:32px}
  .detail .relside [data-full]{flex:1 1 auto;padding-inline:8px}}
.detail .sleeve{box-shadow:0 1px 0 var(--line),0 24px 40px -24px rgba(0,0,0,.6)}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:16px 0 0}
.facts dt{font:500 12px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.facts dd{margin:0}
.artline{font-size:22px;font-weight:500;margin:0 0 4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:8px 0 0}
.tags li{font:12px var(--mono);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.tracks{list-style:none;padding:0;margin:0;border-top:2px solid var(--ink)}
.tracks li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tracks .pos{font:500 14px var(--mono);color:var(--muted)}
.tracks .dur{font:14px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.tracks .tc{grid-column:2/4;font-size:14px;color:var(--muted)}
.tracks .ta{grid-column:2/4}.tracks .ta:empty{display:none}
.tracks audio{width:100%;max-width:520px;height:40px;margin:4px 0}
.tracks .up{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;margin-top:4px}
.tracks .up input[type=file]{font:inherit;font-size:14px;max-width:100%}
.tracks .up input[type=file]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.credits{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-top:2px solid var(--ink)}
.credits div{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
@media (max-width:520px){.credits div{grid-template-columns:minmax(0,1fr);gap:2px}}
.credits .role{color:var(--muted);font-size:14px}
.videos{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.videos a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink)}
.videos a:hover{border-color:var(--loop)}
.play{flex:none;width:30px;height:30px;border-radius:50%;background:var(--loop);display:grid;place-items:center}
.play::after{content:"";border-left:10px solid var(--loop-ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.videos small{display:block;color:var(--muted);font:11px var(--mono)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:600 14px var(--body);padding:9px 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--loop);border-color:var(--loop);color:var(--loop-ink)}
.note{font-size:14px;color:var(--muted);max-width:65ch}
.status{font:13px var(--mono);color:var(--muted);min-height:1.4em}
.roles{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.roles li{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;font:13px/1.5 var(--mono)}
footer{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:13px}
/* Footer player: one bar at the bottom for track sound files (with a waveform timeline) and for the video playing. */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto minmax(0,1.1fr) auto minmax(0,3fr) auto auto;grid-template-areas:"art meta ctl wave time vol";gap:6px 12px;align-items:center}
#dock[hidden]{display:none}
#dock .dmeta,#dock .dart{cursor:pointer}
#pwin{position:fixed;left:0;right:0;top:var(--hdrh,0px);bottom:var(--dockh,72px);z-index:7;background:var(--bg);overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 24px;transform:translateY(100%);transition:transform .32s cubic-bezier(.65,0,.35,1)}
@media (prefers-reduced-motion:reduce){#pwin{transition:none}}
#pwin .pwmini-open,#pwin .pwmini-stop{display:none}
#pwin.mini{top:auto;left:auto;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--dockh,72px) + 8px);width:min(372px,calc(100vw - 16px));padding:6px 8px 8px;overflow:hidden;border-radius:12px;background:var(--surface);box-shadow:0 12px 40px -8px rgba(0,0,0,.6);border:1px solid var(--line)}
#pwin.mini .pwhead{margin:0 0 4px}
#pwin.mini #pwClose{display:none}
#pwin.mini .pwmini-open{display:grid;margin-left:auto}#pwin.mini .pwmini-stop{display:grid}
#pwin.mini .pwbody{display:block}
#pwin.mini .pwart,#pwin.mini .upnext,#pwin.mini #pwTitle,#pwin.mini #pwMeta,#pwin.mini #pwTracks,#pwin.mini .ytbar{display:none}
#pwin.mini .pwvid,#pwin.mini.withart .pwvid{width:100%;margin:0}
#pwin.mini .pwvid .ytbox{min-height:200px}
#pwin.on{transform:none}
#pwin[hidden]{display:none}
#pwin .pwhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#pwin .pwbody{display:grid;grid-template-columns:minmax(0,1fr);gap:20px 24px;align-items:start}
#pwin:not(.withart) .pwvid{width:100%}
/* From tablet width: the video column and Up next are two separate columns, each scrolling on its own. */
@media (min-width:761px){#pwin:not(.mini){overflow:hidden;display:flex;flex-direction:column}
  #pwin:not(.mini) .pwbody{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) clamp(280px,28vw,400px);align-items:stretch}
  #pwin:not(.mini) .pwmain,#pwin:not(.mini) .upnext{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:20px}
  #pwin:not(.mini) .pwbody{column-gap:32px}}
.pwth{margin:22px 0 8px;font-size:18px}
#partyDlg{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:20px;max-width:min(440px,calc(100vw - 32px))}
#partyDlg::backdrop{background:var(--scrim)}
#partyDlg h2{font-size:24px;margin:0 0 10px;text-transform:none}
.partycode{font:700 40px var(--mono);letter-spacing:.2em;margin:0 0 12px;color:var(--loop-text)}
#dock .dparty{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font:600 12px var(--mono);background:var(--loop);color:#000;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}

<script>
(function(){
const C = JSON.parse(document.getElementById("catalog").textContent);
const R = C.releases, P = C.people;
const byId = new Map(R.map(r=>[String(r.id),r]));
const byKey = new Map(P.map(p=>[p.key,p]));
const art = {}, artImgs = {}; // release id -> main cover url / all images
const STANDALONE = !!window.__STANDALONE__;
// Covers built into the site; images staff add in the back office (database "artwork") replace these per release.
function baseArt(){ for(const k in art) delete art[k]; for(const k in artImgs) delete artImgs[k];
  R.forEach(r=>{ if(r.images&&r.images.length){ artImgs[r.id]=r.images.map(u=>({url:u})); art[r.id]=r.images[0]; } }); }
baseArt();
let assetsNS = null, dbNS = null, canEditArt = false;
let filter = "all";
let sortBy = "cat", sortRev = false, scope = "all";
try{ const o=JSON.parse(localStorage.getItem("loop-sort")||"{}"); if(["cat","az","year"].includes(o.by)) sortBy=o.by; sortRev=!!o.rev; }catch(e){}
const SORTS = {cat:["Cat. no.","Catalog number"], az:["A–Z","Artist, A to Z"], year:["Year","Year released"]};
const MOSAIC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>';
const collator = new Intl.Collator("sv", {sensitivity:"base", numeric:true});
function relDate(r){ return String(r.released||r.year||"9999").replace(/-00/g,"-01"); }
// Releases without a year always come last, whichever way the year order runs.
const undatedLast = list => sortBy==="year" ? [...list.filter(x=>(x.r||x).year), ...list.filter(x=>!(x.r||x).year)] : list;
function sortReleases(list){
  const out=[...list];
  if(sortBy==="az") out.sort((a,b)=>collator.compare(artistLine(a),artistLine(b))||collator.compare(a.title||"",b.title||""));
  else if(sortBy==="year") out.sort((a,b)=>relDate(a).localeCompare(relDate(b))||R.indexOf(a)-R.indexOf(b));
  return undatedLast(sortRev?out.reverse():out);
}
function firstYear(p){ const ys=p.releases.map(id=>byId.get(String(id))).filter(Boolean).map(r=>r.year||9999); return ys.length?Math.min(...ys):9999; }
function sortPeople(list){
  const out=[...list];
  if(sortBy==="year") out.sort((a,b)=>firstYear(a)-firstYear(b)||collator.compare(a.name,b.name));
  else out.sort((a,b)=>collator.compare(a.name,b.name));
  return sortRev?out.reverse():out;
}
// Order chips: tap one to order by it, tap the active one again to turn the direction around.
function sortLabel(k, rev, what){
  const az = what==="people"?"Name":what==="videos"?"Title":"Artist";
  return {cat: rev?["Cat. no. ↑","Catalog number, last to first"]:["Cat. no. ↓","Catalog number, first to last"],
          az:  rev?["Z–A",`${az}, Z to A`]:["A–Z",`${az}, A to Z`],
          year:rev?["Year ↑","Year, newest first"]:["Year ↓","Year, oldest first"]}[k];
}
let sortWhat="releases";
function sortRow(what){
  sortWhat=what;
  const eff = (what==="people"&&sortBy==="cat") ? "az" : sortBy;
  return `<div class="chiprow" role="group" aria-label="Order ${what}">${Object.keys(SORTS).filter(k=>what!=="people"||k!=="cat").map(k=>{ const on=eff===k, [t,l]=sortLabel(k, on&&sortRev, what);
    return `<button type="button" class="chip" data-sort="${k}" aria-pressed="${on}" aria-label="${l}">${t}</button>`; }).join("")}</div>`;
}
function wireSort(rerender){
  main.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.sort, eff=(sortWhat==="people"&&sortBy==="cat")?"az":sortBy;
    if(k===eff) sortRev=!sortRev; else { sortBy=k; sortRev=false; }
    saveSort(); rerender(); main.querySelector(`[data-sort="${k}"]`).focus(); announce("Ordered by "+sortLabel(k, sortRev, sortWhat)[1]); });
}
function saveSort(){ try{ localStorage.setItem("loop-sort",JSON.stringify({by:sortBy,rev:sortRev})); }catch(e){} }
let mosaic = false; try{ mosaic = localStorage.getItem("loop-mosaic")==="1"; }catch(e){}
const CHIP = {all:"All", loop:"Loop", plump:"Plumphouse", related:"Licensed"};
const main = document.getElementById("main"), live = document.getElementById("live"), q = document.getElementById("q");
const GROUP = {loop:"Loop Records", plump:"Plumphouse Records", related:"Licensed and appearances"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const artistLine = r => r.artists.map(a=>a.name).join(" & ") || "Various";
const yt = id => "https://www.youtube.com/watch?v=" + id;

// search index
R.forEach(r=>{
  r._s = norm([r.catno, r.catnos.join(" "), r.title, artistLine(r), r.year, r.format, r.styles.join(" "), r.genres.join(" "),
    r.credits.map(c=>c.name+" "+c.role).join(" "),
    r.tracks.map(t=>t.title+" "+t.artists.map(a=>a.name).join(" ")+" "+t.credits.map(c=>c.name+" "+c.role).join(" ")).join(" ")].join(" "));
});
P.forEach(p=>{ p._s = norm(p.name+" "+p.aliases.join(" ")+" "+[...new Set(p.credits.map(c=>c.role))].join(" ")); });

function hue(r){ const m=(r.catno||"").match(/\d+/); const n=m?+m[0]:r.id%97; return r.group==="plump"? (300+n*7)%360 : r.group==="related"? (90+n*11)%360 : (240+(n*5)%16); }
function placeholder(r,bare){
  const h=hue(r), rings=[];
  const seed=(r.id%7)+3;
  const lp = r.group==="loop", ring = i => lp ? (i%2?"hsl(40 60% 94%)":"hsl(16 100% 52%)") : `hsl(${h} 90% ${i%2?82:62}%)`;
  for(let i=0;i<seed;i++) rings.push(`<circle cx="${150+((i%2)?18:-18)}" cy="140" r="${26+i*16}" fill="none" stroke="${ring(i)}" stroke-width="${i%3?3:9}" opacity="${.9-i*.07}"/>`);
  const logo = `<g transform="translate(18 252) scale(.42)" color="hsl(${h} 30% 96%)"><use href="#logo"/></g>`;
  const words = bare ? "" : `<text x="282" y="272" text-anchor="end" fill="hsl(${h} 30% 96%)" font-family="IBM Plex Mono,monospace" font-size="15">${esc(r.catno||"")}</text>
    <text x="18" y="34" fill="hsl(${h} 30% 96%)" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800" font-size="22">${esc((r.title||"").toUpperCase().slice(0,26))}</text>`;
  const a11y = bare ? `aria-hidden="true"` : `role="img" aria-label="Placeholder sleeve for ${esc(r.catno)}, ${esc(r.title)}. Real artwork not added yet."`;
  return `<svg viewBox="0 0 300 300" ${a11y}><rect width="300" height="300" fill="${r.group==="loop"?`hsl(${h} 72% 24%)`:`hsl(${h} 60% 14%)`}"/>${rings.join("")}${logo}${words}</svg>`;
}
function imgUrls(r){ const a=artImgs[r.id]; if(a&&a.length) return a.map(x=>x.url); return r.artwork?[r.artwork]:[]; }
function sleeve(r, swipe){
  const u = imgUrls(r), alt=`Cover of ${esc(r.title)} by ${esc(artistLine(r))}`;
  if(swipe && u.length>1) return `<div class="sleeve multi"><div class="track">${u.map((x,i)=>`<img src="${esc(x)}" alt="${i?"":alt+", 1 of "+u.length+" images"}" loading="lazy" draggable="false">`).join("")}</div><span class="badge" aria-hidden="true">1/${u.length}</span></div>`;
  return `<div class="sleeve">${u.length?`<img src="${esc(u[0])}" alt="${alt}">`:placeholder(r)}</div>`;
}
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const FX_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6" width="10" height="12" rx="1.5"/><path d="M16 7.5c2.5 1 4 2.6 4 4.5s-1.5 3.5-4 4.5M13.5 12h0"/><path d="M17.5 4.5 16 7.5l3 1"/></svg>';
const FX = {random:"Random", fade:"Fade", flipx:"Flip sideways", flipy:"Flip up and down", page:"Page turn"};
let fxMode="random"; try{ fxMode=localStorage.getItem("loop-fx")||"random"; if(!FX[fxMode]) fxMode="random"; }catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
function runFx(f, from, to, type){
  f._busy=true;
  const done=()=>{ from.classList.remove("on"); to.classList.add("on"); from.style.zIndex=to.style.zIndex=""; f._busy=false; };
  if(type==="fade"){
    to.style.zIndex=2; to.classList.add("on");
    to.animate([{opacity:0},{opacity:1}],{duration:1000,easing:"ease-in-out"}).onfinish=done;
  } else if(type==="flipx"||type==="flipy"){
    const ax = type==="flipx" ? "rotateY" : "rotateX", dir = Math.random()<.5?1:-1;
    from.style.zIndex=2;
    from.animate([{transform:`${ax}(0deg)`,transformOrigin:"50% 50%"},{transform:`${ax}(${90*dir}deg)`,transformOrigin:"50% 50%"}],{duration:380,easing:"ease-in"}).onfinish=()=>{
      from.classList.remove("on"); to.style.zIndex=2; to.classList.add("on");
      to.animate([{transform:`${ax}(${-90*dir}deg)`,transformOrigin:"50% 50%"},{transform:`${ax}(0deg)`,transformOrigin:"50% 50%"}],{duration:380,easing:"ease-out"}).onfinish=done; };
  } else { // page turn: the current sleeve turns away on its left edge and reveals the next one underneath
    to.classList.add("on"); to.style.zIndex=1; from.style.zIndex=2;
    from.animate([{transform:"perspective(900px) rotateY(0deg)",transformOrigin:"0% 50%",filter:"brightness(1)"},{transform:"perspective(900px) rotateY(-100deg)",filter:"brightness(.55)",offset:.6},{transform:"perspective(900px) rotateY(-180deg)",filter:"brightness(.4)"}],
      {duration:1100,easing:"cubic-bezier(.45,.05,.35,1)"}).onfinish=done;
  }
}
setInterval(()=>{ if(!mosaic||reducedMotion.matches||document.hidden) return; const now=performance.now();
  document.querySelectorAll(".mosaic .fade").forEach(f=>{
    if(!f._next){ f._next = now + rnd(1200,6500); return; }
    if(f._busy || now<f._next) return;
    const ims=f.children, i=+f.dataset.i, j=(i+1)%ims.length; f.dataset.i=j;
    const kinds=["fade","flipx","flipy","page"]; const type = fxMode==="random" ? kinds[Math.floor(Math.random()*kinds.length)] : fxMode;
    runFx(f, ims[i], ims[j], type);
    f._next = now + rnd(3000,8500);
  }); }, 250);
document.addEventListener("scroll", e=>{ const t=e.target; if(!t.classList||!t.classList.contains("track")) return;
  const k=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));

// ---------- Level meter: a vertical meter on the far right while a sound file plays ----------
// It measures the real sound of uploaded files. YouTube's sound can't be measured by a web page,
// so for videos the meter stays away rather than pretend.
const vu = (()=>{
  // Like the Breakin Bread player's strip: 32 LED segments a side, RMS from -40 to 0 dBFS, instant rise,
  // slow controlled fall, peak hold 1.4 s. It only moves with sound it can really measure (our own sound
  // files); for YouTube videos it stays still rather than pretend.
  const el=document.getElementById("vu"), bars=[el.querySelector(".vul"), el.querySelector(".vur")];
  const SEG=32, MIN_DB=-40, ATTACK=1, RELEASE=0.28, HOLD=1400;
  bars.forEach(b=>{ b.innerHTML=Array.from({length:SEG},(_,i)=>`<i style="--k:${i/(SEG-1)}"></i>`).join(""); });
  let ctx=null, an=[null,null], raf=0, tries=0, lvl=[0,0], pk=[0,0], pkAt=[0,0];
  function connect(){
    if(ctx||tries++) return !!ctx;
    try{ const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
      const srcN=ctx.createMediaElementSource(dock.audio), sp=ctx.createChannelSplitter(2);
      an=[ctx.createAnalyser(), ctx.createAnalyser()]; an.forEach(a=>a.fftSize=2048);
      srcN.connect(ctx.destination); srcN.connect(sp); sp.connect(an[0],0); sp.connect(an[1],1);
    }catch(e){ ctx=null; } return !!ctx;
  }
  const rms=a=>{ const buf=new Float32Array(a.fftSize); a.getFloatTimeDomainData(buf); let s=0; for(const x of buf) s+=x*x; const db=10*Math.log10(s/buf.length||1e-12); return Math.max(0,Math.min(1,(db-MIN_DB)/-MIN_DB)); };
  function paint(){ const now=performance.now();
    bars.forEach((b,i)=>{ const on=Math.round(lvl[i]*SEG), p=Math.round(pk[i]*SEG)-1;
      [...b.children].forEach((seg,k)=>{ seg.className = k<on ? "on" : k===p && p>=0 ? "pk" : ""; }); }); }
  function tick(){
    const live = ctx && !dock.audio.paused;
    const now=performance.now();
    for(let i=0;i<2;i++){
      let v = live ? rms(an[i]) : 0;
      if(i===1 && live && v<0.01 && lvl[0]>0.02) v=rms(an[0]); // a mono file shows the same on both sides
      lvl[i] = v>lvl[i] ? lvl[i]+(v-lvl[i])*ATTACK : lvl[i]+(v-lvl[i])*RELEASE;
      if(lvl[i]>=pk[i]){ pk[i]=lvl[i]; pkAt[i]=now; } else if(now-pkAt[i]>HOLD){ pk[i]=Math.max(lvl[i], pk[i]-0.015); }
    }
    paint();
    if(live || lvl[0]>0.002 || lvl[1]>0.002) raf=requestAnimationFrame(tick); else { raf=0; pk=[0,0]; paint(); }
  }
  function start(){ if(!connect()) return; if(ctx.state==="suspended") ctx.resume(); if(!raf) raf=requestAnimationFrame(tick); }
  // Shown whenever the footer player is; still when nothing measurable plays.
  const showWithDock=()=>{ el.hidden=document.getElementById("dock").hidden; };
  new MutationObserver(showWithDock).observe(document.getElementById("dock"),{attributes:true,attributeFilter:["hidden"]}); showWithDock();
  dock.audio.addEventListener("play",start); dock.audio.addEventListener("pause",()=>{ if(!raf) raf=requestAnimationFrame(tick); });
  return {start};
})();

// ---------- Listening party: several phones play the same track in step ----------
// Like Breakin Bread's party: one phone hosts, the others join with a code or link. The host's player drives
// everyone; members measure the clock difference to the host (NTP-style ping) and keep within a third of a
// second, correcting every two seconds. Runs over a Supabase Realtime broadcast channel, nothing is stored.
const party = (()=>{
  const dlg=document.getElementById("partyDlg"), body=document.getElementById("partyBody"), msg=document.getElementById("partyMsg"), chip=document.getElementById("dParty");
  const me=Math.random().toString(36).slice(2,10);
  let ch=null, code=null, host=false, offset=0, offs=[], timer=null, members=1, synced=false;
  const sb=()=>window.LoopBackend&&window.LoopBackend.client;
  const newCode=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
  const link=()=>location.href.split("#")[0]+"#party-"+code;
  function render(){
    chip.hidden=!code; chip.textContent=code?`Party ${code} · ${members}`:""; chip.setAttribute("aria-label", code?`Listening party ${code}, ${members} ${members===1?"phone":"phones"}. Open the party`:"");
    if(!code){ body.innerHTML=`<h2 id="partyTitle">Listening party</h2>
      <p>Play the same track on several phones at the same time. One phone starts the party and the others join with its code or link.</p>
      <div class="btnrow"><button type="button" class="btn primary" data-p="start">Start a party</button></div>
      <form class="staffform" id="partyJoin"><label for="partyCode">Party code</label><input id="partyCode" autocomplete="off" autocapitalize="characters" maxlength="6" inputmode="text">
      <div class="btnrow"><button class="btn" type="submit">Join</button><button class="btn" type="button" data-p="close">Close</button></div></form>`; }
    else if(host){ body.innerHTML=`<h2 id="partyTitle">You're hosting a listening party</h2>
      <p>Party code</p><p class="partycode" aria-label="Party code ${code.split("").join(" ")}">${code}</p>
      <p>${members} ${members===1?"phone":"phones"} in the party. What you play, everyone hears.</p>
      <div class="btnrow"><button type="button" class="btn primary" data-p="share">Share the link</button><button type="button" class="btn" data-p="end">End the party</button><button type="button" class="btn" data-p="close">Close</button></div>`; }
    else { body.innerHTML=`<h2 id="partyTitle">In listening party ${code}</h2>
      <p>${synced?"In step with the host.":"Getting in step with the host…"} ${members} ${members===1?"phone":"phones"} in the party.</p>
      <div class="btnrow"><button type="button" class="btn" data-p="leave">Leave the party</button><button type="button" class="btn" data-p="close">Close</button></div>`; }
    const f=document.getElementById("partyJoin"); if(f) f.onsubmit=e=>{ e.preventDefault(); const c=document.getElementById("partyCode").value.trim().toUpperCase(); if(c.length<4){ msg.textContent="Type the party code first."; return; } join(c,false); };
  }
  body.addEventListener("click",async e=>{ const b=e.target.closest("[data-p]"); if(!b) return; const a=b.dataset.p;
    if(a==="close") dlg.close();
    if(a==="start") join(newCode(),true);
    if(a==="end"||a==="leave"){ leave(); msg.textContent=a==="end"?"Party ended.":"You left the party."; render(); }
    if(a==="share"){ try{ if(navigator.share){ await navigator.share({title:"Loop Records listening party",text:"Listen with me, party code "+code,url:link()}); return; } }catch(err){ if(err&&err.name==="AbortError") return; }
      try{ await navigator.clipboard.writeText(link()); msg.textContent="Link copied."; }catch(err){ prompt("Copy this link", link()); } } });
  function open(){ msg.textContent=""; render(); if(!dlg.open) dlg.showModal(); const h=document.getElementById("partyTitle"); if(h){ h.tabIndex=-1; h.focus(); } }
  function state(){ const s=dock.current(); if(!s||!s.ref) return null; return {ref:s.ref, playing:s.isPlaying(), pos:s.cur(), ht:Date.now()}; }
  function send(ev,payload){ try{ ch&&ch.send({type:"broadcast",event:ev,payload}); }catch(e){} }
  function hostTick(){ const st=state(); if(st) send("state",st); }
  async function apply(p){
    const hostNow=Date.now()+offset, target=p.pos+(p.playing?(hostNow-p.ht)/1000:0);
    let s=dock.current(); const same=s&&s.ref&&JSON.stringify(s.ref)===JSON.stringify(p.ref);
    if(!same){
      if(p.ref.kind==="video"){ const v=VIDS.find(x=>x.id===p.ref.vid); if(!v) return; await pwin.open(v,p.playing); }
      else { const r=byId.get(String(p.ref.rid)); if(!r) return; dock.playTrack(r,p.ref.pos); }
      setTimeout(()=>{ const s2=dock.current(); if(s2) s2.seek(target+0.8); },800); return;
    }
    if(p.playing && !s.isPlaying()) s.play(); if(!p.playing && s.isPlaying()) s.pause();
    const drift=s.cur()-target; if(p.playing && Math.abs(drift)>0.35) s.seek(target);
    if(!synced && p.playing && Math.abs(drift)<=0.35){ synced=true; render(); announce("In step with the party."); }
  }
  function join(c, asHost){
    const client=sb(); if(!client){ msg.textContent="Listening parties work on the live site, not in this preview."; return; }
    leave(true); code=c; host=asHost; offset=0; offs=[]; synced=false; members=1;
    ch=client.channel("loop-party-"+code,{config:{broadcast:{self:false},presence:{key:me}}});
    ch.on("broadcast",{event:"state"},({payload})=>{ if(!host) apply(payload); });
    ch.on("broadcast",{event:"ping"},({payload})=>{ if(host) send("pong",{to:payload.from,t0:payload.t0,ht:Date.now()}); });
    ch.on("broadcast",{event:"pong"},({payload})=>{ if(payload.to!==me) return; const t1=Date.now(); offs.push(payload.ht-(payload.t0+t1)/2); offs.sort((a,b)=>a-b); offset=offs[Math.floor(offs.length/2)]; });
    ch.on("broadcast",{event:"hello"},()=>{ if(host) hostTick(); });
    ch.on("broadcast",{event:"end"},()=>{ if(!host){ leave(); announce("The host ended the party."); render(); } });
    ch.on("presence",{event:"sync"},()=>{ members=Object.keys(ch.presenceState()).length||1; render(); });
    ch.subscribe(async status=>{
      if(status!=="SUBSCRIBED") return;
      await ch.track({host:asHost});
      if(asHost){ clearInterval(timer); timer=setInterval(hostTick,2000); hostTick(); announce("Party started. Code "+code.split("").join(" ")); }
      else { for(let i=0;i<5;i++){ send("ping",{from:me,t0:Date.now()}); await new Promise(r=>setTimeout(r,250)); } send("hello",{}); announce("Joined party "+code); }
      render();
    });
    render();
  }
  function leave(quiet){ if(ch){ if(host) send("end",{}); try{ ch.unsubscribe(); }catch(e){} } ch=null; clearInterval(timer); timer=null; if(!quiet){ code=null; host=false; } render(); }
  // the host's own presses go out at once, not only every two seconds
  ["dPlay","dPrev","dNext"].forEach(id=>document.getElementById(id).addEventListener("click",()=>{ if(host) setTimeout(hostTick,400); }));
  document.getElementById("dSeek").addEventListener("change",()=>{ if(host) setTimeout(hostTick,200); });
  chip.onclick=open;
  // Long press on Play opens the party (screen readers: double tap and hold, or the context menu).
  const play=document.getElementById("dPlay"); let lp=null, swallow=false;
  play.addEventListener("pointerdown",()=>{ clearTimeout(lp); lp=setTimeout(()=>{ swallow=true; if(navigator.vibrate) navigator.vibrate(20); open(); },550); });
  ["pointerup","pointerleave","pointercancel"].forEach(t=>play.addEventListener(t,()=>clearTimeout(lp)));
  play.addEventListener("click",e=>{ if(swallow){ swallow=false; e.preventDefault(); e.stopImmediatePropagation(); } },true);
  play.addEventListener("contextmenu",e=>{ e.preventDefault(); clearTimeout(lp); open(); });
  play.setAttribute("aria-description","Long press for a listening party");
  return { open, join, prompt:c=>{ code=null; open(); const i=document.getElementById("partyCode"); if(i){ i.value=c; msg.textContent="Press Join to listen along with party "+c+"."; } } };
})();

// ---------- Clean YouTube player: no YouTube overlays, our own controls underneath ----------
const YT_ICONS={play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',
  sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  muted:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'};
const ytIcon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${YT_ICONS[k]}</svg>`;
const ytClock=t=>{ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };
const ytSpoken=t=>{ t=Math.max(0,Math.floor(t||0)); const m=Math.floor(t/60), s=t%60; return (m?m+(m===1?" minute ":" minutes "):"")+s+(s===1?" second":" seconds"); };
const cleanPlayers=new Set();
function cleanPlayer(box, o){
  box.classList.add("clean"); box.classList.remove("playing","letthrough");

  let bar=box.nextElementSibling; if(!bar||!bar.classList.contains("ytbar")){ bar=document.createElement("div"); bar.className="ytbar"; box.after(bar); }
  bar.setAttribute("role","group"); bar.setAttribute("aria-label","Video controls: "+o.title);
  bar.innerHTML=`<button type="button" class="ico" data-c="play" aria-label="Play">${ytIcon("play")}</button>
    <input type="range" class="ytseek" min="0" max="1000" value="0" step="1" aria-label="Position in the video" aria-valuetext="0 seconds">
    <span class="yttime" aria-hidden="true">0:00 / 0:00</span>
    <button type="button" class="ico" data-c="mute" aria-label="Mute">${ytIcon("sound")}</button>
    ${document.fullscreenEnabled?`<button type="button" class="ico" data-c="full" aria-label="Full screen">${ytIcon("full")}</button>`:""}`;
  const playB=bar.querySelector('[data-c="play"]'), muteB=bar.querySelector('[data-c="mute"]'), fullB=bar.querySelector('[data-c="full"]'),
        seek=bar.querySelector(".ytseek"), time=bar.querySelector(".yttime"), hint=box.querySelector(".ythint"), poster=box.querySelector(".ytposter");
  let title=o.title, dragging=false, ticker=null, startCheck=null;
  const h={ player:null, box, bar, vid:o.id, iframe:()=>h.player&&h.player.getIframe&&h.player.getIframe() };
  const dur=()=>{ try{ return h.player.getDuration()||0; }catch(e){ return 0; } };
  const cur=()=>{ try{ return h.player.getCurrentTime()||0; }catch(e){ return 0; } };
  function paint(){ const d=dur(), c=cur(); if(!dragging){ seek.value=d?Math.round(c/d*1000):0; } seek.style.setProperty("--p",(seek.value/10)+"%");
    time.textContent=`${ytClock(c)} / ${ytClock(d)}`; seek.setAttribute("aria-valuetext",`${ytSpoken(c)} of ${ytSpoken(d)}`); }
  function setPlaying(on){ box.classList.toggle("playing",on); playB.innerHTML=ytIcon(on?"pause":"play"); playB.setAttribute("aria-label",on?"Pause":"Play");
    clearInterval(ticker); if(on) ticker=setInterval(paint,250); paint(); }
  function needTap(){ box.classList.add("letthrough"); hint.hidden=false; announce("Tap the video once to start it."); }
  function play(){ if(!h.ready){ h.wanted=true; return; } if(!h.player||!h.player.playVideo) return; cleanPlayers.forEach(x=>{ if(x!==h) try{ x.player.pauseVideo(); }catch(e){} });
    h.player.playVideo(); clearTimeout(startCheck); startCheck=setTimeout(()=>{ let st=-1; try{ st=h.player.getPlayerState(); }catch(e){} if(st===-1||st===5) needTap(); },4000); }
  function toggle(){ let st=-1; try{ st=h.player.getPlayerState(); }catch(e){} st===1||st===3 ? h.player.pauseVideo() : play(); }

// Each video is linked to the track it holds when the track's title appears in the video's title

function trackForVideo(r, title){
  const vt=" "+norm(title).replace(/[^a-z0-9]+/g," ")+" "; let best=null, bl=0;
  for(const t of r.tracks||[]){ const tt=norm(t.title).replace(/\(.*?\)|\[.*?\]/g," ").replace(/[^a-z0-9]+/g," ").trim();
    if(tt.length>=3 && vt.includes(" "+tt+" ") && tt.length>bl){ best=t; bl=tt.length; } }
  return best;
}

// SOUND: "<release id>_<pos>" -> {release, pos, url, path, name, size, type, at}. Filled from the

const SOUND = {}; let audioStaff = false, soundFocus = null;

function trackLabel(r, t){ return `${t.pos} ${t.title}`; }
function renderAudio(r, onlyPos){
  const AB = window.LoopBackend && window.LoopBackend.audio;
  main.querySelectorAll(".tracks .ta[data-track]").forEach(slot => {
    const pos = slot.dataset.track; if(onlyPos!=null && pos!==onlyPos) return;

    let html = snd ? `<button type="button" class="btn small trackplay" data-playtrack="${esc(pos)}" aria-label="Play ${esc(trackLabel(r,t))}">Play</button>`
      : tv ? `<button type="button" class="btn small trackplay" data-playvideo="${esc(tv.id)}" aria-label="Play ${esc(trackLabel(r,t))}, video">Play video</button>`
      : STANDALONE ? `<span class="nosound">No sound yet</span>` : "";

      html += `<span class="up"><label for="${id}">${snd ? "Replace sound file for" : "Add sound file for"} ${esc(trackLabel(r,t))}</label>
        <input type="file" id="${id}" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.aif,.aiff,.ogg" data-up="${esc(pos)}">
        ${snd ? `<button type="button" class="btn small" data-rmsnd="${esc(pos)}">Remove sound file</button>` : ""}</span>`;
    }
    const hadFocus = slot.contains(document.activeElement);
    slot.innerHTML = html;
    if(hadFocus || soundFocus === pos){ const el = slot.querySelector(".trackplay") || slot.querySelector("input"); if(el){ el.focus(); if(soundFocus === pos && el.classList.contains("trackplay")) soundFocus = null; } }
  });

document.addEventListener("change", async e => {
  const inp = e.target.closest && e.target.closest("input[data-up]"); if(!inp || !inp.files || !inp.files[0]) return;
  const r = location.hash.startsWith("#release-") && byId.get(location.hash.slice(9)); if(!r) return;
  const pos = inp.dataset.up, t = r.tracks.find(x => x.pos === pos), file = inp.files[0], key = soundKey(r, pos), old = SOUND[key];
  const mb = (file.size/1048576).toFixed(1);
  inp.disabled = true; setArtMsg(r, `Uploading ${file.name} (${mb} MB) for ${trackLabel(r,t)}. This can take a minute for big files.`);

});
document.addEventListener("click", async e => {

const slideAt = {};

function hexRgb(h){ h=String(h||"").replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }

// ---------- screensaver: after a while with no touch, a full-screen moving mosaic of the sleeves ----------

let saverTimer=null, saverSwap=null;
function saverAllowed(){
  if(!LOOK.saver) return false;
  if(document.querySelector("dialog[open]")) return false;
  const a=document.activeElement; if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  if([...document.querySelectorAll("audio,video")].some(m=>!m.paused)) return false;

function armSaver(){ clearTimeout(saverTimer); const s=Math.max(3, Number(LOOK.saverDelay)||9); if(LOOK.saver) saverTimer=setTimeout(showSaver, s*1000); }
function showSaver(){
  if(!saverAllowed()){ armSaver(); return; }
  const urls=[...new Set(R.flatMap(r=>imgUrls(r).slice(0,1)).filter(Boolean))]; if(!urls.length) return;
  let el=document.getElementById("saver");
  if(!el){ el=document.createElement("div"); el.id="saver"; el.setAttribute("aria-hidden","true"); document.body.appendChild(el); }
  const w=innerWidth, h=innerHeight, size=w<600?w/4:w<1000?w/6:w/8, cols=Math.round(w/size), rows=Math.max(1,Math.round(h/size)), n=cols*rows;
  el.style.gridTemplateColumns=`repeat(${cols},1fr)`; el.style.gridTemplateRows=`repeat(${rows},1fr)`;
  const uniq=[...new Set(urls)];
  const shuffled=uniq.sort(()=>Math.random()-0.5);
  el.innerHTML=Array.from({length:n},(_,i)=>`<div class="st"><img src="${esc(shuffled[i%shuffled.length])}" alt="" class="on"><img alt=""></div>`).join("");
  el.hidden=false; requestAnimationFrame(()=>el.classList.add("on"));
  clearInterval(saverSwap);
  if(!reducedMotion.matches){
    let tick=0;
    saverSwap=setInterval(()=>{
      tick++;
      const tiles=[...el.children].filter(t=>!t.dataset.busy); if(!tiles.length) return;
      if(tick%22===0){ // now and then a wave: a whole row or column turns over, one after another
        const cols=getComputedStyle(el).gridTemplateColumns.split(" ").length, all=[...el.children];
        const byRow=Math.random()<.5, line=Math.floor(Math.random()*(byRow?Math.ceil(all.length/cols):cols));
        const fx=["flip","swivel","pageflip","slide"][Math.floor(Math.random()*4)];
        all.filter((t,i)=>byRow?Math.floor(i/cols)===line:i%cols===line).forEach((t,k)=>setTimeout(()=>swapTile(t,fx),k*120));
        return;
      }
      swapTile(tiles[Math.floor(Math.random()*tiles.length)]);
      if(Math.random()<.45) swapTile(tiles[Math.floor(Math.random()*tiles.length)]);
    }, 380);
  }
  function swapTile(t, fx){
    if(!t || t.dataset.busy) return; t.dataset.busy="1";
    const [a,b]=t.querySelectorAll("img"), on=a.classList.contains("on")?a:b, off=on===a?b:a;
    off.onload=()=>{ (off.decode?off.decode():Promise.resolve()).catch(()=>{}).then(()=>requestAnimationFrame(()=>saverFx(fx||SAVER_FX[Math.floor(Math.random()*SAVER_FX.length)], on, off).then(()=>{ delete t.dataset.busy; delete t.dataset.next; }))); };
    off.onerror=()=>{ delete t.dataset.busy; delete t.dataset.next; };
    // Never two of the same sleeve on screen: skip everything showing now and everything on its way in.
    const shown=new Set([...el.querySelectorAll("img.on")].map(i=>i.getAttribute("src")));
    el.querySelectorAll(".st[data-next]").forEach(x=>shown.add(x.dataset.next));
    const fresh=urls.filter(u=>!shown.has(u)); if(!fresh.length){ delete t.dataset.busy; return; }
    const pick=fresh[Math.floor(Math.random()*fresh.length)]; t.dataset.next=pick;
    off.src=pick;
  }
}
// Transition effects between two sleeves in a tile: fade, flip (sideways), swivel (top to bottom), page flip, slide.
// No zooming and no spinning flat on the screen, as Gordon asked.
const SAVER_FX=["fade","flip","swivel","pageflip","slide","slide","flip","fade"];
function saverFx(kind, outEl, inEl){
  // One smooth S-curve for the whole move: slow start, quick through the middle, slow, soft landing.
  const T=kind==="fade"?1800:1600, ease="cubic-bezier(.65,0,.35,1)";
  const anim=(el,k,o)=>el.animate(k,Object.assign({duration:T,easing:ease,fill:"both"},o||{})).finished.catch(()=>{});
  inEl.classList.add("on"); outEl.classList.remove("top"); inEl.classList.add("top");
  let p;
  if(kind==="flip"||kind==="swivel"){ const ax=kind==="flip"?"rotateY":"rotateX";
    // Both halves share one timeline, so the S-curve runs through the whole flip without a break in the middle.
    p=Promise.all([anim(outEl,[{transform:`${ax}(0deg)`,opacity:1,offset:0},{transform:`${ax}(90deg)`,opacity:1,offset:.5},{transform:`${ax}(90deg)`,opacity:0,offset:1}]),
                   anim(inEl,[{transform:`${ax}(-90deg)`,opacity:0,offset:0},{transform:`${ax}(-90deg)`,opacity:1,offset:.5},{transform:`${ax}(0deg)`,opacity:1,offset:1}])]); }
  else if(kind==="pageflip"){ inEl.classList.remove("top"); outEl.classList.add("top"); inEl.style.opacity=1;
    p=anim(outEl,[{transform:"rotateY(0deg)",transformOrigin:"0% 50%",opacity:1},{transform:"rotateY(-90deg)",transformOrigin:"0% 50%",opacity:1}]); }
  else if(kind==="slide"){ const [x,y]=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)], tr=(k)=>`translate(${x*k}%,${y*k}%)`;
    p=Promise.all([anim(outEl,[{transform:tr(0),opacity:1},{transform:tr(-100),opacity:1}]),anim(inEl,[{transform:tr(100),opacity:1},{transform:tr(0),opacity:1}])]); }
  else if(kind==="iris") p=Promise.all([anim(inEl,[{clipPath:"circle(0% at 50% 50%)",opacity:1},{clipPath:"circle(75% at 50% 50%)",opacity:1}]),anim(outEl,[{opacity:1},{opacity:1}])]);
  else p=Promise.all([anim(outEl,[{opacity:1},{opacity:0}]),anim(inEl,[{opacity:0},{opacity:1}])]);
  return p.then(()=>{ outEl.classList.remove("on"); [outEl,inEl].forEach(e=>{ e.getAnimations().forEach(x=>x.cancel()); e.style.opacity=""; }); });
}
